name: APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
    steps:
      - name: Aláírókulcs ellenőrzése
        id: key
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Hiányzik a RELEASE_KEYSTORE_B64 vagy a RELEASE_KEYSTORE_PASSWORD a repó Secrets beállításai közül, ezért most nem készül APK."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
      - uses: actions/setup-java@v4
        if: steps.key.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.key.outputs.ok == 'true'
        with:
          gradle-version: '8.14.3'
      - name: Fordítás
        if: steps.key.outputs.ok == 'true'
        run: |
          KS="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$KS"
          export RELEASE_KEYSTORE="$KS"
          export RELEASE_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          export RELEASE_KEY_PASSWORD="$KEYSTORE_PASSWORD"
          export RELEASE_KEY_ALIAS=remoteforadguardhome
          gradle assembleRelease --no-daemon
          rm -f "$KS"
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.ok == 'true'
        with:
          name: Remote-for-AdGuard-Home
          path: app/build/outputs/apk/release/*.apk
      - name: Release
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          APK=app/build/outputs/apk/release/Remote-for-AdGuard-Home-$VER.apk
          MSG=$(git log -1 --format=%B | grep -v -e '^Co-Authored-By' -e '^Claude-Session')
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" "$APK" --clobber
            gh release edit "v$VER" --notes "$MSG"
          else
            gh release create "v$VER" "$APK" --title "Remote for AdGuard Home $VER" --notes "$MSG" --target "$GITHUB_SHA"
          fi
      # Az appon belüli frissítéshez: az APK a nyilvános kiadás-repóba is felkerül, mellé egy
      # kis JSON (verzió, versionCode, SHA-256, változások), amit az app induláskor elolvas.
      # A KIADASOK_TOKEN csak a laskiss-dev/kiadasok repóba tud írni (Contents: Read and write).
      - name: Kiadás a frissítési tárhelyre
        if: steps.key.outputs.ok == 'true'
        env:
          KIADASOK_TOKEN: ${{ secrets.KIADASOK_TOKEN }}
        run: |
          if [ -z "$KIADASOK_TOKEN" ]; then
            echo "::warning::Hiányzik a KIADASOK_TOKEN a repó Secrets beállításai közül, ezért ez a verzió nem kerül fel a kiadás-repóba, az appon belüli frissítés nem fogja látni."
            exit 0
          fi
          export GH_TOKEN="$KIADASOK_TOKEN"
          REPO=laskiss-dev/kiadasok
          NAME=remote-for-adguard-home
          VER=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          CODE=$(grep -oP "versionCode \K[0-9]+" app/build.gradle)
          APK=app/build/outputs/apk/release/Remote-for-AdGuard-Home-$VER.apk
          TAG="$NAME-v$VER"
          URL="https://github.com/$REPO/releases/download/$TAG/$(basename "$APK")"
          JSON="$RUNNER_TEMP/$NAME.json"
          python3 -I .github/kiadas.py "$APK" hu.laskiss.remoteforadguardhome "$VER" "$CODE" "$URL" \
            app/src/main/java/hu/laskiss/remoteforadguardhome/InfoActivity.java "$JSON"
          NOTES=$(python3 -I -c "import json,sys; d=json.load(open(sys.argv[1])); print('\n'.join('- ' + c for c in d['changes']))" "$JSON")
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "$APK" --repo "$REPO" --title "Remote for AdGuard Home $VER" --notes "$NOTES"
          fi
          # A jelzőfájl csak az APK feltöltése után frissül, így az app sosem lát félkész kiadást.
          SHA=$(gh api "repos/$REPO/contents/$NAME.json" --jq .sha 2>/dev/null || true)
          ARGS=(-X PUT "repos/$REPO/contents/$NAME.json" -f message="Remote for AdGuard Home $VER" -f content="$(base64 -w0 "$JSON")")
          if [ -n "$SHA" ]; then ARGS+=(-f sha="$SHA"); fi
          gh api "${ARGS[@]}" > /dev/null
          echo "Kiadva: https://github.com/$REPO/releases/tag/$TAG"
